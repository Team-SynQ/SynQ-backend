# nginx/conf.d/default.conf

upstream backend {
    # 동적 설정 파일 읽어오기
    include /etc/nginx/conf.d/active-env.inc;
}

# Upgrade 헤더가 있을 때만 Connection: upgrade 를 붙인다.
# 모든 요청에 무조건 박으면 WebSocket 이 아닌 일반 요청의 keep-alive 가 깨진다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 커스텀 log_format
log_format synq_log '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

# HTTP(80): Certbot 갱신 및 HTTPS 리다이렉트
server {
    listen 80;
    server_name api.synqai.co.kr;

    # Certbot 갱신용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTPS 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443): 실제 서비스 로직 처리
server {
    listen 443 ssl;
    server_name api.synqai.co.kr;

    # SSL 인증서 경로 설정
    ssl_certificate /etc/letsencrypt/live/api.synqai.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.synqai.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 요청 크기 제한 (파일 업로드 여유 공간 확보)
    client_max_body_size 50M;

    # 커스텀 로그 포맷 적용
    access_log /var/log/nginx/access.log synq_log;
    error_log /var/log/nginx/error.log warn;

    # 실시간 전사 WebSocket. 회의 내내 열려 있어야 해서 일반 API 와 타임아웃 정책이 다르다.
    #
    # proxy_read_timeout 은 "업스트림에서 데이터를 읽지 못한 시간"을 재는데, 발화가 없는 구간에는
    # 서버가 클라이언트로 내려보낼 전사 메시지가 없다. 오디오는 클라이언트→서버 방향이라 이 타이머를
    # 되돌리지 못해, 침묵이 이어지면 멀쩡한 연결이 유휴로 판정돼 close 프레임 없이(1006) 끊긴다.
    # 서버가 30초마다 ping 을 보내 이걸 막지만, 스케줄러가 밀렸을 때를 대비해 여기도 넉넉히 잡는다.
    # 상한을 Soniox 의 스트림 상한(300분)보다 위에 둬서 nginx 가 먼저 끊는 일이 없게 한다.
    location /ws/ {
        proxy_pass http://backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 21600s;
        proxy_read_timeout 21600s;
    }

    # Spring Boot로 요청 프록시 패스
    location / {
        proxy_pass http://backend;

        # 클라이언트 IP 및 프로토콜 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # AI 기능 대비 타임아웃 마진 확장
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}