# nginx/conf.d/default.conf

upstream backend {
    # 동적 설정 파일 읽어오기
    include /etc/nginx/conf.d/active-env.inc;
}

# 커스텀 log_format
log_format synq_log '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

# HTTP(80): Certbot 갱신 및 HTTPS 리다이렉트
server {
    listen 80;
    server_name synq-api.duckdns.org;

    # Certbot 갱신용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTPS 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443): 실제 서비스 로직 처리
server {
    listen 443 ssl;
    server_name synq-api.duckdns.org;

    # SSL 인증서 경로 설정
    ssl_certificate /etc/letsencrypt/live/synq-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synq-api.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 요청 크기 제한 (파일 업로드 여유 공간 확보)
    client_max_body_size 50M;

    # 커스텀 로그 포맷 적용
    access_log /var/log/nginx/access.log synq_log;
    error_log /var/log/nginx/error.log warn;

    # Spring Boot로 요청 프록시 패스
    location / {
        proxy_pass http://backend;

        # 클라이언트 IP 및 프로토콜 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI 기능 대비 타임아웃 마진 확장
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}