plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.synq'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// 호스트 오디오 수신용 raw WebSocket(STOMP 미사용)
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// Soniox 실시간 STT 는 공식 Java SDK 가 없어 raw WebSocket 으로 직접 연동한다.
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'

	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Health Check
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// .env 를 Spring 프로퍼티 소스로 등록
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// Hibernate 6.6 의 pgvector 지원
	implementation "org.hibernate.orm:hibernate-vector:${dependencyManagement.managedVersions['org.hibernate.orm:hibernate-core']}"

	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// 링크 참고자료 본문에서 텍스트를 뽑는다.
	implementation 'org.jsoup:jsoup:1.18.3'

	// 참고자료 파일(PDF/DOCX/PPTX/TXT)에서 본문 텍스트를 뽑는다.
	implementation 'org.apache.tika:tika-core:3.3.1'
	implementation 'org.apache.tika:tika-parsers-standard-package:3.3.1'

	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'software.amazon.awssdk:s3:2.25.60'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	// 링크 fetch 테스트용 로컬 HTTP 서버. 이미 쓰는 OkHttp 와 같은 버전으로 맞춘다.
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testImplementation 'org.awaitility:awaitility'
	// Tika 가 전이로 끌어오는 것과 같은 라이브러리이므로 버전을 맞춘다.
	testImplementation 'org.apache.pdfbox:pdfbox:3.0.7'
	testImplementation 'org.apache.poi:poi-ooxml:5.5.1'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// lombok.config 는 Lombok 이 생성하는 코드를 바꾸지만 Gradle 은 이 파일을 컴파일 입력으로 보지 않는다.
// 선언해두지 않으면 설정만 바뀐 경우 compileJava 가 UP-TO-DATE 로 스킵되어,
// 브랜치를 받은 사람이 clean 없이 빌드하면 낡은 클래스로 앱이 기동한다.
tasks.withType(JavaCompile).configureEach {
	// inputs.file 은 파일이 없으면 빌드를 실패시킨다. 컬렉션은 부재를 허용하면서 변경은 그대로 감지한다.
	inputs.files('lombok.config')
			.withPropertyName('lombokConfig')
			.withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.named('test') {
	useJUnitPlatform()
	// Testcontainers 의 docker-java 는 기본적으로 낮은 Engine API 버전을 요청해서
	// 최신 Docker(Engine API 최소 1.40)가 400 으로 거부한다. 명시적으로 맞춰준다.
	// 최소 1.44 (Docker 25+). 더 낮은 Docker 를 쓰면 DOCKER_API_VERSION 으로 덮어쓴다.
	systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'
}
