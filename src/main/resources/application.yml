spring:
  application:
    name: synq-backend
  # 기본 활성 프로파일은 local(개발 편의). 운영 등 비-dev 환경은 SPRING_PROFILES_ACTIVE 를 명시적으로 지정한다.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # 로컬 기본값은 docker-compose.yml 의 postgres 설정과 동일.
    # 운영 등에서는 환경변수(DB_URL/DB_USERNAME/DB_PASSWORD)로 주입한다. 비밀정보 커밋 금지.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/synq}
    username: ${DB_USERNAME:synq}
    password: ${DB_PASSWORD:synq}
    hikari:
      # HNSW 는 후보를 먼저 뽑고 WHERE 를 나중에 적용한다. 청크 검색은 항상 project_id 로
      # 거르므로, 켜두지 않으면 결과가 topK 보다 적게 나올 수 있다.
      connection-init-sql: SET hnsw.iterative_scan = strict_order
  http:
    client:
      # 연결 자체가 안되는 상황을 빨리 감지.
      connect-timeout: 5s
      read-timeout: 60s
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    out-of-order: true
  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. Hibernate 는 엔티티-스키마 불일치를 검증만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  lifecycle:
    timeout-per-shutdown-phase: 90s

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-minutes: 30
  refresh-token-expiration-days: 14

project:
  invitation:
    frontend-base-url: ${FRONTEND_BASE_URL:https://synq.app}
    expiration-days: 7

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  client-secret: ${KAKAO_CLIENT_SECRET:}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  client-secret: ${GOOGLE_CLIENT_SECRET}

naver:
  client-id: ${NAVER_CLIENT_ID}
  redirect-uri: ${NAVER_REDIRECT_URI}
  client-secret: ${NAVER_CLIENT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: https://generativelanguage.googleapis.com/v1beta
  embedding:
    model: gemini-embedding-001
    dimensions: 768
    batch-size: 100
    max-attempts: 3
    initial-backoff-millis: 1000
    backoff-multiplier: 4

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html      # 접속 주소: http://localhost:8080/swagger-ui.html
  api-docs:
    path: /v3/api-docs          # JSON 스펙: http://localhost:8080/v3/api-docs

soniox:
  # 실제 키는 SONIOX_API_KEY 환경변수로 주입한다.
  api-key: ${SONIOX_API_KEY:}
  url: ${SONIOX_URL:wss://stt-rt.soniox.com/transcribe-websocket}
  model: ${SONIOX_MODEL:stt-rt-preview}
  # MediaRecorder 가 보내는 webm 컨테이너를 그대로 흘린다. 프론트가 raw PCM 으로 바뀌면 여기를 바꾼다.
  audio-format: ${SONIOX_AUDIO_FORMAT:auto}
  language-hints: ${SONIOX_LANGUAGE_HINTS:ko,en}
  # <end> 토큰이 오지 않을 때를 대비한 안전망. 주 경로를 방해하지 않도록 넉넉히 잡는다.
  segment-idle-timeout-ms: ${SONIOX_SEGMENT_IDLE_TIMEOUT_MS:5000}
  # 회의 종료 후 Soniox 가 남은 토큰을 flush 할 때까지 기다리는 최대 시간.
  close-flush-timeout-ms: ${SONIOX_CLOSE_FLUSH_TIMEOUT_MS:3000}

openai:
  # 실제 키는 OPENAI_API_KEY 환경변수로 주입한다.
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  # 기능별 모델 환경변수가 없을 때만 사용하는 전환용 기본값이다.
  model: ${OPENAI_MODEL:gpt-5.6-terra}
  timeout: ${OPENAI_TIMEOUT:30s}

# 모든 환경에서 필요한 값이라 프로파일 밖에 둔다.
# 기본값은 임의로 잡은 출발점이고, local 전용 /local/rag/search 로 튜닝한다.
ai:
  chat:
    client: ${AI_CHAT_CLIENT}
    model: ${AI_CHAT_MODEL:${OPENAI_MODEL:gpt-5.6-terra}}
    reasoning-effort: ${AI_CHAT_REASONING_EFFORT:low}
    max-output-tokens: ${AI_CHAT_MAX_OUTPUT_TOKENS:2000}
    recent-transcript-limit: ${AI_CHAT_RECENT_TRANSCRIPT_LIMIT:12}
    linked-segment-window: ${AI_CHAT_LINKED_SEGMENT_WINDOW:2}
    recent-turn-limit: ${AI_CHAT_RECENT_TURN_LIMIT:5}
    rag-top-k: ${AI_CHAT_RAG_TOP_K:5}
    rag-min-similarity: ${AI_CHAT_RAG_MIN_SIMILARITY:0.5}
  rag:
    search:
      top-k: ${AI_RAG_SEARCH_TOP_K:5}
      min-similarity: ${AI_RAG_SEARCH_MIN_SIMILARITY:0.5}
  # 3-hint 는 속도 우선이라 rag.search 기본값과 별도로 더 타이트하게 잡는다.
  assistant:
    # 3-hint 관련 대역(생성기 + 포트) 활성화 스위치. Record/Project 실제 어댑터 전까지 prod 도 fake 로 기동한다.
    client: ${AI_ASSISTANT_CLIENT:fake}
    model: ${AI_ASSISTANT_MODEL:${OPENAI_MODEL:gpt-5.6-terra}}
    reasoning-effort: ${AI_ASSISTANT_REASONING_EFFORT:low}
    max-output-tokens: ${AI_ASSISTANT_MAX_OUTPUT_TOKENS:1200}
    hint:
      window-before: ${AI_ASSISTANT_HINT_WINDOW_BEFORE:2}
      window-after: ${AI_ASSISTANT_HINT_WINDOW_AFTER:2}
      top-k: ${AI_ASSISTANT_HINT_TOP_K:3}
      min-similarity: ${AI_ASSISTANT_HINT_MIN_SIMILARITY:0.3}
  summary:
    client: ${AI_SUMMARY_CLIENT:fake}
    model-name: ${AI_SUMMARY_MODEL:${OPENAI_MODEL:gpt-5.6-sol}}
    reasoning-effort: ${AI_SUMMARY_REASONING_EFFORT:medium}
    max-output-tokens: ${AI_SUMMARY_MAX_OUTPUT_TOKENS:8000}
    prompt-version: ${AI_SUMMARY_PROMPT_VERSION:v1}
    # 토큰 수를 정밀 계산하기 전 입력 폭주를 막는 보수적인 문자 수 제한.
    max-input-chars: ${AI_SUMMARY_MAX_INPUT_CHARS:250000}
    # 서버 중단 등으로 완료되지 못한 활성 Job을 다음 요청에서 복구하는 기준.
    active-job-timeout: ${AI_SUMMARY_ACTIVE_JOB_TIMEOUT:30m}
  live-context:
    client: ${AI_LIVE_CONTEXT_CLIENT:openai}
    model: ${AI_LIVE_CONTEXT_MODEL:${OPENAI_MODEL:gpt-5.6-luna}}
    reasoning-effort: ${AI_LIVE_CONTEXT_REASONING_EFFORT:low}
    max-output-tokens: ${AI_LIVE_CONTEXT_MAX_OUTPUT_TOKENS:1200}
  event:
    sse:
      timeout: ${AI_EVENT_SSE_TIMEOUT:30m}
      heartbeat-interval: ${AI_EVENT_SSE_HEARTBEAT_INTERVAL:20s}
      queue-capacity: ${AI_EVENT_SSE_QUEUE_CAPACITY:100}

reference:
  link:
    connect-timeout: ${REFERENCE_LINK_CONNECT_TIMEOUT:3s}
    read-timeout: ${REFERENCE_LINK_READ_TIMEOUT:10s}
    # slowloris 방어. connect/read 만으로는 스레드가 영구 점유될 수 있다.
    call-timeout: ${REFERENCE_LINK_CALL_TIMEOUT:15s}
    # 프리플라이트는 트랜잭션 안에서 돌아 DB 커넥션을 점유하므로 더 짧게 끊는다.
    preflight-call-timeout: ${REFERENCE_LINK_PREFLIGHT_CALL_TIMEOUT:5s}
    max-content-bytes: ${REFERENCE_LINK_MAX_CONTENT_BYTES:5242880}
    # 정규화 후 이 길이 미만이면 본문이 없는 것으로 본다. JS 렌더링 페이지가 여기서 걸린다.
    min-text-length: ${REFERENCE_LINK_MIN_TEXT_LENGTH:50}
    # 사설망 접근 허용. 프로덕션에서 켜면 SSRF 방어가 통째로 무력화된다.
    allow-private-network: ${REFERENCE_LINK_ALLOW_PRIVATE_NETWORK:false}

---
# local(dev) 전용 편의 설정
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      port: ${SPRING_DATA_REDIS_PORT:6380}

ai:
  chat:
    # local에서는 API 키 없이 채팅 저장과 응답 흐름을 검증한다.
    client: ${AI_CHAT_CLIENT:fake}
  summary:
    client: ${AI_SUMMARY_CLIENT:fake}
  live-context:
    # local에서는 Fake 구현체로 전사 이벤트와 영속 흐름을 검증한다.
    client: ${AI_LIVE_CONTEXT_CLIENT:fake}
  assistant:
    # 3-hint 생성기. 실제 OpenAI 호출 확인 시 openai로 변경한다.
    client: ${AI_ASSISTANT_CLIENT:fake}

reference:
  link:
    # local 에서는 localhost 로 띄운 문서 서버로 실험할 수 있어야 한다.
    allow-private-network: ${REFERENCE_LINK_ALLOW_PRIVATE_NETWORK:true}

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-production-env}

kakao:
  client-id: ${KAKAO_CLIENT_ID:local-dev-placeholder-kakao-client-id}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/login/callback}

google:
  client-id: ${GOOGLE_CLIENT_ID:local-dev-placeholder-google-client-id}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/login/callback}
  client-secret: ${GOOGLE_CLIENT_SECRET:local-dev-placeholder-google-client-secret}

naver:
  client-id: ${NAVER_CLIENT_ID:local-dev-placeholder-naver-client-id}
  redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:3000/login/callback}
  client-secret: ${NAVER_CLIENT_SECRET:local-dev-placeholder-naver-client-secret}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
